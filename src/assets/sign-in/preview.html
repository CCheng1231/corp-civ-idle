<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sign-in title options</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 1.25rem;
        font-family: "DM Sans", system-ui, sans-serif;
        background: #0f1419;
        color: #e8eef5;
      }
      h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 1rem; }
      .grid {
        display: grid;
        gap: 1.25rem;
        max-width: 1200px;
      }
      figure {
        margin: 0;
        border: 1px solid #2a3544;
        border-radius: 0.65rem;
        overflow: hidden;
        background: #171e27;
      }
      figcaption {
        padding: 0.65rem 0.85rem;
        font-size: 0.9rem;
        color: #93a1b5;
      }
      figcaption strong { color: #56b4e9; }
      img {
        display: block;
        width: 100%;
        height: auto;
        vertical-align: middle;
      }
    </style>
  </head>
  <body>
    <h1>Corp Civ Idle — sign-in title options (16:9)</h1>
    <div class="grid">
      <figure>
        <img src="./sign-in-title-hex-empire.jpg" alt="" />
        <figcaption><strong>1 — Hex empire</strong> · world map / online HQ</figcaption>
      </figure>
      <figure>
        <img src="./sign-in-title-boardroom.jpg" alt="" />
        <figcaption><strong>2 — Boardroom</strong> · idle resources / CEO fantasy</figcaption>
      </figure>
      <figure>
        <img src="./sign-in-title-bid-rise.jpg" alt="" />
        <figcaption><strong>3 — Bid &amp; rise</strong> · jobs, contractors, expansion</figcaption>
      </figure>
    </div>
  </body>
</html>
