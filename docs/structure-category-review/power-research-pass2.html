<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corp Civ Idle — Power &amp; research Pass 2</title>
  <link rel="stylesheet" href="./essentials-review.css" />
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>Power &amp; research — Pass 2 (not wired)</h1>
      <p>
        Pick a whole <strong>v1–v4</strong> lineup (banner + three structures). Distinct layouts: breaker alcove · generator bay · R&amp;D lab.
        <a href="./index.html">← Hub</a> ·
        <a href="./power-research-finals.html">Finals</a> ·
        <a href="./power-research.html">Pass 0</a>
      </p>
    </header>

    <div class="export-crops-bar">
      <strong>Crop settings export</strong>
      <p class="genre-meta" style="margin:0.35rem 0">
        Zoom · Focal X · Focal Y · Card strip 5.4×8.5rem · category strip 9.5×2.35rem.
      </p>
      <button type="button" id="copy-crops-all">Copy all crop JSON</button>
      <button type="button" id="copy-crops-banner">Copy banner only</button>
      <button type="button" id="copy-crops-ts">Copy TS crop snippet (finals shape)</button>
      <pre id="crop-json" aria-live="polite"></pre>
    </div>

    <div id="sets"></div>
  </div>
  <script src="./power-research-pass2-data.js"></script>
  <script src="./power-research-wire-defaults.js"></script>
  <script src="./essentials-crop-tuner.js"></script>
  <script>
    const IMG_B = "./images/power-research/pass2/banners/";
    const IMG_S = "./images/power-research/pass2/structures/";
    const bannerCropIds = [];
    const CATEGORY_TITLE = "Power & research";

    function stripMock(file) {
      const cropId = "pass2-banner:" + file;
      bannerCropIds.push(cropId);
      return `
        <div class="strip-label">Category banner mock</div>
        <div class="header-row-mock">
          <span class="title">${CATEGORY_TITLE}</span>
          <div class="header-strip crop-tuner-wrap" data-crop-id="${cropId}">
            <img class="crop-tuner-target" src="${IMG_B}${file}" alt="" />
          </div>
        </div>`;
    }

    function cardMock(s, version) {
      const cropId = `pass2-v${version}:${s.file}`;
      return `
        <article class="card">
          <img class="portrait" src="${IMG_S}${s.file}" alt="${s.name}" loading="lazy" />
          <div class="card-body">
            <h3>${s.name}</h3>
            <p>${s.note}</p>
            <span class="pill">${s.file}</span>
            <div class="strip-label">Build card mock</div>
            <div class="structure-card-mock">
              <div class="structure-card-mock-portrait crop-tuner-wrap" data-crop-id="${cropId}">
                <img class="crop-tuner-target" src="${IMG_S}${s.file}" alt="" />
              </div>
              <div class="structure-card-mock-body">
                <strong>${s.name}</strong>
                <span class="muted">Set v${version} · Lv 1 → 2</span>
              </div>
            </div>
          </div>
        </article>`;
    }

    const root = document.getElementById("sets");
    for (const set of POWER_RESEARCH_PASS2_SETS) {
      const section = document.createElement("section");
      section.className = "genre-block";
      section.id = "set-v" + set.version;
      const bannerCard = `
        <article class="card card-banner">
          <img class="full" src="${IMG_B}${set.banner.file}" alt="${set.banner.title}" loading="lazy" />
          <div class="card-body">
            <h3>${set.banner.title}</h3>
            <p>${set.banner.note}</p>
            <span class="pill">${set.banner.file}</span>
            ${stripMock(set.banner.file)}
          </div>
        </article>`;
      const structureCards = set.structures.map((s) => cardMock(s, set.version)).join("");
      section.innerHTML = `
        <h2>Version ${set.version} set — ${set.style}</h2>
        <div class="grid grid-set">
          ${bannerCard}
          ${structureCards}
        </div>`;
      root.appendChild(section);
    }

    document.querySelectorAll(".crop-tuner-wrap").forEach((wrap) => {
      const cropId = wrap.getAttribute("data-crop-id");
      const cardBody = wrap.closest(".card-body");
      initCropTuner(cardBody, cropId, POWER_RESEARCH_WIRE.getReviewCropDefaults(cropId));
    });

    function refreshCropJson() {
      document.getElementById("crop-json").textContent = JSON.stringify(
        exportReviewCrops(allReviewCropIds()),
        null,
        2,
      );
    }
    document.addEventListener("review-crop-change", refreshCropJson);
    refreshCropJson();

    function flash(btn) {
      const prev = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = prev; }, 1200);
    }
    document.getElementById("copy-crops-all").addEventListener("click", () => {
      copyReviewCropsJson(allReviewCropIds()).then(() =>
        flash(document.getElementById("copy-crops-all")),
      );
    });
    document.getElementById("copy-crops-banner").addEventListener("click", () => {
      copyReviewCropsJson(bannerCropIds).then(() =>
        flash(document.getElementById("copy-crops-banner")),
      );
    });
    document.getElementById("copy-crops-ts").addEventListener("click", () => {
      copyReviewCropsTypeScript(allReviewCropIds()).then(() =>
        flash(document.getElementById("copy-crops-ts")),
      );
    });
  </script>
</body>
</html>
