<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Corp Civ Idle — Departments Pass 1</title>
  <link rel="stylesheet" href="./essentials-review.css" />
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <h1>Departments — Pass 1 (not wired)</h1>
      <p>
        Drop JPGs under <code>images/departments/pass1/</code>. Same Essentials production style · card strip 5.4×8.5rem.
        <a href="./index.html">← Hub</a> · <a href="./departments.html">Pass 0</a> ·
        <a href="./departments-pass2.html">Pass 2</a>
      </p>
    </header>

    <div class="export-crops-bar">
      <strong>Crop settings export</strong>
      <p class="genre-meta" style="margin:0.35rem 0">Tune banner + Build card mocks before picking Pass 2 sets.</p>
      <button type="button" id="copy-crops-all">Copy all crop JSON</button>
      <button type="button" id="copy-crops-banner">Copy banner only</button>
      <pre id="crop-json" aria-live="polite"></pre>
    </div>

    <section class="genre-block">
      <h2>Category banner — choose 1 of 3</h2>
      <div class="grid" id="banners"></div>
    </section>

    <div id="structures"></div>
  </div>
  <script src="./departments-pass1-data.js"></script>
  <script src="./departments-wire-defaults.js"></script>
  <script src="./essentials-crop-tuner.js"></script>
  <script>
    const IMG_B = "./images/departments/pass1/banners/";
    const IMG_S = "./images/departments/pass1/structures/";
    const banners = DEPARTMENTS_PASS1_BANNERS;
    const structures = DEPARTMENTS_PASS1_STRUCTURES;
    const bannerCropIds = [];

    function stripMock(file, base) {
      const cropId = "banner:" + file;
      bannerCropIds.push(cropId);
      return `
        <div class="strip-label">Header mock</div>
        <div class="header-row-mock">
          <span class="title">Departments</span>
          <div class="header-strip crop-tuner-wrap" data-crop-id="${cropId}">
            <img class="crop-tuner-target" src="${base}${file}" alt="" />
          </div>
        </div>`;
    }

    function cardPortraitMock(file) {
      const cropId = "structure:" + file;
      return `
        <div class="strip-label">Build card mock</div>
        <div class="structure-card-mock">
          <div class="structure-card-mock-portrait crop-tuner-wrap" data-crop-id="${cropId}">
            <img class="crop-tuner-target" src="${IMG_S}${file}" alt="" />
          </div>
          <div class="structure-card-mock-body">
            <strong>Structure</strong>
            <span class="muted">Departments · Lv 1 → 2</span>
          </div>
        </div>`;
    }

    document.getElementById("banners").innerHTML = banners
      .map(
        (b) => `
      <article class="card">
        <img class="full" src="${IMG_B}${b.file}" alt="${b.title}" loading="lazy" onerror="this.classList.add('full');this.alt='missing file'" />
        <div class="card-body">
          <h3>${b.title}</h3>
          <p>${b.note}</p>
          <span class="pill">${b.file}</span>
          ${stripMock(b.file, IMG_B)}
        </div>
      </article>`,
      )
      .join("");

    const structRoot = document.getElementById("structures");
    for (const group of structures) {
      const section = document.createElement("section");
      section.className = "genre-block";
      section.innerHTML = `
        <h2>${group.name} <code>${group.id}</code></h2>
        <p class="genre-meta">${group.hint}</p>
        <div class="grid">
          ${group.variants
            .map(
              (v) => `
            <article class="card">
              <img class="portrait" src="${IMG_S}${v.file}" alt="${v.title}" loading="lazy" />
              <div class="card-body">
                <h3>${v.title}</h3>
                <p>${v.note}</p>
                <span class="pill">${v.file}</span>
                ${cardPortraitMock(v.file)}
              </div>
            </article>`,
            )
            .join("")}
        </div>`;
      structRoot.appendChild(section);
    }

    document.querySelectorAll(".crop-tuner-wrap").forEach((wrap) => {
      const cropId = wrap.getAttribute("data-crop-id");
      const card = wrap.closest(".card-body");
      initCropTuner(
        card || wrap.parentElement,
        cropId,
        DEPARTMENTS_WIRE.getReviewCropDefaults(cropId),
      );
    });

    function refreshCropJson() {
      document.getElementById("crop-json").textContent = JSON.stringify(
        exportReviewCrops(allReviewCropIds()),
        null,
        2,
      );
    }
    document.addEventListener("review-crop-change", refreshCropJson);
    refreshCropJson();

    function flash(btn) {
      const prev = btn.textContent;
      btn.textContent = "Copied";
      setTimeout(() => { btn.textContent = prev; }, 1200);
    }
    document.getElementById("copy-crops-all").addEventListener("click", () => {
      copyReviewCropsJson(allReviewCropIds()).then(() =>
        flash(document.getElementById("copy-crops-all")),
      );
    });
    document.getElementById("copy-crops-banner").addEventListener("click", () => {
      copyReviewCropsJson(bannerCropIds).then(() =>
        flash(document.getElementById("copy-crops-banner")),
      );
    });
  </script>
</body>
</html>
